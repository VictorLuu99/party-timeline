name = "party-timeline"
compatibility_date = "2025-09-01"
pages_build_output_dir = "./dist"

[[d1_databases]]
binding = "DB"
database_name = "party-db"
database_id = "a2555a85-ca25-40f9-863e-94a12014ea89"
migrations_dir = "db/migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "party-photos"

# PUBLIC_R2_URL, ADMIN_PASSWORD, JWT_SECRET, R2_* are set as Pages secrets
# (via `wrangler pages secret put <NAME> --project-name party-timeline`).
# Do NOT also define them under [vars] here — Pages will reject the deploy
# with "Binding name X already in use".
